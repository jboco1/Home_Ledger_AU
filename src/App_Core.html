<script>
  'use strict';

  var state = { data: null, view: 'dashboard', selected: null, search: '', category: 'all', tag: 'all', budgetMode: 'Annual', budgetMonth: '' };
  var money = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' });
  var titles = {
    dashboard: ['HOUSEHOLD FINANCES', 'Overview'],
    summary: ['FINANCIAL YEAR SUMMARY', 'Income & spend'],
    transactions: ['ALL ACTIVITY', 'Transactions'],
    review: ['CHECK & CONFIRM', 'Review'],
    tax: ['AUSTRALIAN FINANCIAL YEAR', 'Tax'],
    budget: ['SPENDING PLAN', 'Budget'],
    rules: ['AUTOMATIC CATEGORISATION', 'Rules'],
    manage: ['HOUSEHOLD SETTINGS', 'Accounts, categories & tags'],
    import: ['ADD TRANSACTIONS', 'Import']
  };

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function showError(error) {
    var loading = document.getElementById('loading');
    var message = error && error.message ? error.message : String(error);
    loading.classList.remove('hidden');
    loading.innerHTML = '<div class="loader-mark">!</div><p>' + escapeHtml(message) + '</p>';
  }

  function toast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    window.setTimeout(function () { el.classList.remove('show'); }, 3000);
  }

  function server(name, args, success, failure) {
    var runner = google.script.run
      .withSuccessHandler(success || function () {})
      .withFailureHandler(failure || showError);
    runner[name].apply(runner, args || []);
  }

  function loadData() {
    google.script.run
      .withSuccessHandler(function (data) {
        state.data = data;
        document.getElementById('userEmail').textContent = data.userEmail || '';
        buildFySelect();
        render();
        document.getElementById('loading').classList.add('hidden');
      })
      .withFailureHandler(showError)
      .getAppData();
  }

  function setView(view) {
    state.view = view;
    var items = document.querySelectorAll('.nav-item');
    var i;
    for (i = 0; i < items.length; i += 1) items[i].classList.toggle('active', items[i].getAttribute('data-view') === view);
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('viewEyebrow').textContent = titles[view][0];
    document.getElementById('viewTitle').textContent = titles[view][1];
    render();
  }

  function sum(values) {
    return values.reduce(function (total, value) { return total + Number(value || 0); }, 0);
  }

  function needsReview(t) {
    return !t.reviewed || t.category === 'Uncategorised' || t.taxStatus === 'Needs review';
  }

  function deductibleValue(t) {
    return Math.abs(Number(t.amount)) * Number(t.deductiblePercent || 0) / 100;
  }

  function transactionSplits(id) {
    return (state.data.splits || []).filter(function (part) { return String(part.TransactionId) === String(id); });
  }

  function transactionTags(t) {
    return String(t.tags || '').split(',').map(function (tag) { return tag.trim(); }).filter(Boolean);
  }

  function categoryRecord(name) {
    return (state.data.categories || []).filter(function (category) {
      return String(category.Name) === String(name);
    })[0] || null;
  }

  function categoryGroup(name) {
    var category = categoryRecord(name);
    return category ? String(category.Group || '') : '';
  }

  function isTransferCategory(name) {
    return name === 'Transfers' || name === 'Split' || categoryGroup(name) === 'Transfers' || categoryGroup(name) === 'System';
  }

  function isBudgetCategory(category) {
    return ['Income', 'Transfers', 'System', 'Review'].indexOf(String(category.Group || '')) === -1;
  }

  function budgetCategoryName(name) {
    var category = categoryRecord(name);
    return category && category.Parent ? String(category.Parent) : String(name);
  }

  function tagChips(t) {
    var names = transactionTags(t);
    return names.map(function (name) {
      var found = (state.data.tags || []).filter(function (tag) { return String(tag.Name) === name; })[0];
      var colour = found ? found.Colour : '#6c7c89';
      return '<span class="tag-chip" style="--tag-colour:' + escapeHtml(colour) + '">' + escapeHtml(name) + '</span>';
    }).join('');
  }

  function taxItems(transactions) {
    var output = [];
    transactions.forEach(function (t) {
      var parts = transactionSplits(t.id);
      if (parts.length) {
        parts.forEach(function (part) {
          output.push({
            merchant: t.merchant || t.description,
            date: t.date,
            amount: -Math.abs(Number(part.Amount)),
            category: part.Category,
            owner: part.Owner,
            taxStatus: part.TaxStatus,
            deductiblePercent: Number(part.DeductiblePercent || 0)
          });
        });
      } else output.push(t);
    });
    return output;
  }

  function budgetItems(transactions) {
    var output = [];
    transactions.forEach(function (t) {
      var parts = transactionSplits(t.id);
      if (parts.length) {
        parts.forEach(function (part) { output.push({ date: t.date, amount: -Math.abs(Number(part.Amount)), category: part.Category }); });
      } else output.push(t);
    });
    return output;
  }

  function dateText(value) {
    var d = new Date(value + 'T00:00:00');
    return isNaN(d.getTime()) ? value : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function selectedFyStart() {
    return Number(document.getElementById('fySelect').value);
  }

  function selectedFyLabel() {
    var y = selectedFyStart();
    return 'FY ' + y + '–' + String(y + 1).slice(-2);
  }

  function fyTransactions() {
    var y = selectedFyStart();
    var from = y + '-07-01';
    var to = (y + 1) + '-06-30';
    return state.data.transactions.filter(function (t) { return t.date >= from && t.date <= to; });
  }

  function financialYearMonths(year) {
    var months = [];
    var month;
    for (month = 7; month <= 12; month += 1) months.push(year + '-' + String(month).padStart(2, '0'));
    for (month = 1; month <= 6; month += 1) months.push((year + 1) + '-' + String(month).padStart(2, '0'));
    return months;
  }

  function budgetMonthKey() {
    var year = selectedFyStart();
    var available = financialYearMonths(year);
    if (available.indexOf(state.budgetMonth) === -1) {
      var now = new Date();
      var current = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      state.budgetMonth = available.indexOf(current) !== -1 ? current : available[0];
    }
    return state.budgetMonth;
  }

  function monthText(key) {
    var parts = String(key).split('-');
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
    return date.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
  }

  function stat(label, value, note) {
    return '<article class="stat"><span class="meta">' + escapeHtml(label) + '</span><strong>' + escapeHtml(value) + '</strong><div class="mini">' + escapeHtml(note) + '</div></article>';
  }

  function taxChip(t) {
    if (t.taxStatus === 'Not deductible') return '<span class="chip">No</span>';
    if (t.taxStatus === 'Needs review') return '<span class="chip review">Review</span>';
    return '<span class="chip tax">' + Number(t.deductiblePercent || 0) + '%</span>';
  }

  function transactionTable(transactions, clickable) {
    if (!transactions.length) return '<div class="empty"><strong>No transactions found</strong>Import a CSV or change your filters.</div>';
    var rows = transactions.map(function (t) {
      var attrs = clickable ? ' data-tx="' + escapeHtml(t.id) + '" tabindex="0" role="button"' : '';
      var card = t.card ? escapeHtml(t.card) : '—';
      var sourceCategory = t.sourceCategory ? escapeHtml(t.sourceCategory) : '—';
      return '<tr' + attrs + '><td><span class="merchant">' + escapeHtml(t.merchant || t.description) + (t.receiptFileId ? ' <span title="Receipt attached">📎</span>' : '') + '</span><span class="sub">' + dateText(t.date) + ' · ' + escapeHtml(t.account) + '</span><span class="tag-list">' + tagChips(t) + '</span></td><td><span class="chip ' + (needsReview(t) ? 'review' : '') + '">' + escapeHtml(categoryNameLabel(t.category)) + '</span></td><td>' + sourceCategory + '</td><td>' + escapeHtml(t.owner || 'Joint') + '</td><td>' + card + '</td><td>' + taxChip(t) + '</td><td class="amount ' + (t.amount > 0 ? 'income' : '') + '">' + money.format(t.amount) + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>Merchant</th><th>Category</th><th>Source category</th><th>Owner</th><th>Card</th><th>Tax</th><th style="text-align:right">Amount</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

</script>
