<script>

  function renderRules() {
    var rows = state.data.rules.map(function (r) {
      var description = r.Pattern ? 'Description ' + String(r.MatchType || 'contains') + ' “' + String(r.Pattern) + '”' : 'Any description';
      var operator = String(r.AmountOperator || 'none');
      var amount = '';
      if (operator === 'equals') amount = 'Amount equals ' + money.format(Number(r.AmountMin || 0));
      if (operator === 'above') amount = 'Amount above ' + money.format(Number(r.AmountMin || 0));
      if (operator === 'below') amount = 'Amount below ' + money.format(Number(r.AmountMin || 0));
      if (operator === 'between') amount = 'Amount between ' + money.format(Number(r.AmountMin || 0)) + ' and ' + money.format(Number(r.AmountMax || 0));
      return '<div class="rule"><code><strong>' + escapeHtml(description) + '</strong>' + (amount ? '<small>' + escapeHtml(amount) + '</small>' : '') + '</code><span>' + escapeHtml(categoryNameLabel(r.Category)) + '</span><span>' + escapeHtml(r.Owner || 'Joint') + '</span><span class="chip">' + escapeHtml(r.TaxStatus) + '</span><button class="danger" data-delete-rule="' + escapeHtml(r.Id) + '">Delete</button></div>';
    }).join('');
    var accountOptions = '<option value="">All accounts</option>' + options((state.data.accounts || []).map(function (account) { return account.Name; }));
    return '<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Categorisation rules</h2><p>Rules can match a description, an absolute transaction amount, or both.</p></div></div><div class="rules-list">' + (rows || '<div class="empty">No rules yet</div>') + '</div></section><section class="panel"><div class="panel-head"><div><h2>Add a rule</h2><p>When description and amount are provided, both must match.</p></div></div><form id="ruleForm" class="form-grid">' +
      '<div class="field full"><label>Description text (optional)</label><input name="pattern" placeholder="e.g. WOOLWORTHS"></div><div class="field"><label>Description comparison</label><select name="matchType">' + options(['contains', 'starts with', 'exact']) + '</select></div><div class="field"><label>Account</label><select name="account">' + accountOptions + '</select></div>' +
      '<div class="field"><label>Amount comparison</label><select name="amountOperator" id="ruleAmountOperator"><option value="none">No amount condition</option><option value="equals">Equals</option><option value="above">Above</option><option value="below">Below</option><option value="between">Between</option></select></div><div class="field" id="ruleAmountMinField"><label id="ruleAmountMinLabel">Amount</label><input name="amountMin" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field hidden" id="ruleAmountMaxField"><label>Maximum amount</label><input name="amountMax" type="number" min="0" step="0.01" placeholder="0.00"></div>' +
      '<div class="field"><label>Category</label><select name="category">' + categoryOptions(state.data.categories) + '</select></div><div class="field"><label>Owner</label><select name="owner">' + options(['Joint', 'You', 'Wife']) + '</select></div><div class="field"><label>Tax treatment</label><select name="taxStatus">' + options(['Not deductible', 'Needs review', 'Potential deduction', 'Deductible']) + '</select></div><div class="field"><label>Deductible %</label><input name="deductiblePercent" type="number" min="0" max="100" value="0"></div><div class="field full"><button class="primary" type="submit">Save rule</button></div></form></section></div>';
  }

</script>
