<script>
(function () {
  'use strict';

  var state = { data: null, view: 'dashboard', selected: null, search: '', category: 'all', tag: 'all', budgetMode: 'Annual', budgetMonth: '' };
  var money = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD' });
  var titles = {
    dashboard: ['HOUSEHOLD FINANCES', 'Overview'],
    transactions: ['ALL ACTIVITY', 'Transactions'],
    review: ['CHECK & CONFIRM', 'Review'],
    tax: ['AUSTRALIAN FINANCIAL YEAR', 'Tax'],
    budget: ['SPENDING PLAN', 'Budget'],
    rules: ['AUTOMATIC CATEGORISATION', 'Rules'],
    manage: ['HOUSEHOLD SETTINGS', 'Accounts, categories & tags'],
    import: ['ADD TRANSACTIONS', 'Import']
  };

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function showError(error) {
    var loading = document.getElementById('loading');
    var message = error && error.message ? error.message : String(error);
    loading.classList.remove('hidden');
    loading.innerHTML = '<div class="loader-mark">!</div><p>' + escapeHtml(message) + '</p>';
  }

  function toast(message) {
    var el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('show');
    window.setTimeout(function () { el.classList.remove('show'); }, 3000);
  }

  function server(name, args, success, failure) {
    var runner = google.script.run
      .withSuccessHandler(success || function () {})
      .withFailureHandler(failure || showError);
    runner[name].apply(runner, args || []);
  }

  function loadData() {
    google.script.run
      .withSuccessHandler(function (data) {
        state.data = data;
        document.getElementById('userEmail').textContent = data.userEmail || '';
        buildFySelect();
        render();
        document.getElementById('loading').classList.add('hidden');
      })
      .withFailureHandler(showError)
      .getAppData();
  }

  function setView(view) {
    state.view = view;
    var items = document.querySelectorAll('.nav-item');
    var i;
    for (i = 0; i < items.length; i += 1) items[i].classList.toggle('active', items[i].getAttribute('data-view') === view);
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('viewEyebrow').textContent = titles[view][0];
    document.getElementById('viewTitle').textContent = titles[view][1];
    render();
  }

  function sum(values) {
    return values.reduce(function (total, value) { return total + Number(value || 0); }, 0);
  }

  function needsReview(t) {
    return !t.reviewed || t.category === 'Uncategorised' || t.taxStatus === 'Needs review';
  }

  function deductibleValue(t) {
    return Math.abs(Number(t.amount)) * Number(t.deductiblePercent || 0) / 100;
  }

  function transactionSplits(id) {
    return (state.data.splits || []).filter(function (part) { return String(part.TransactionId) === String(id); });
  }

  function transactionTags(t) {
    return String(t.tags || '').split(',').map(function (tag) { return tag.trim(); }).filter(Boolean);
  }

  function tagChips(t) {
    var names = transactionTags(t);
    return names.map(function (name) {
      var found = (state.data.tags || []).filter(function (tag) { return String(tag.Name) === name; })[0];
      var colour = found ? found.Colour : '#6c7c89';
      return '<span class="tag-chip" style="--tag-colour:' + escapeHtml(colour) + '">' + escapeHtml(name) + '</span>';
    }).join('');
  }

  function taxItems(transactions) {
    var output = [];
    transactions.forEach(function (t) {
      var parts = transactionSplits(t.id);
      if (parts.length) {
        parts.forEach(function (part) {
          output.push({
            merchant: t.merchant || t.description,
            date: t.date,
            amount: -Math.abs(Number(part.Amount)),
            category: part.Category,
            owner: part.Owner,
            taxStatus: part.TaxStatus,
            deductiblePercent: Number(part.DeductiblePercent || 0)
          });
        });
      } else output.push(t);
    });
    return output;
  }

  function budgetItems(transactions) {
    var output = [];
    transactions.forEach(function (t) {
      var parts = transactionSplits(t.id);
      if (parts.length) {
        parts.forEach(function (part) { output.push({ amount: -Math.abs(Number(part.Amount)), category: part.Category }); });
      } else output.push(t);
    });
    return output;
  }

  function dateText(value) {
    var d = new Date(value + 'T00:00:00');
    return isNaN(d.getTime()) ? value : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function selectedFyStart() {
    return Number(document.getElementById('fySelect').value);
  }

  function selectedFyLabel() {
    var y = selectedFyStart();
    return 'FY ' + y + '–' + String(y + 1).slice(-2);
  }

  function fyTransactions() {
    var y = selectedFyStart();
    var from = y + '-07-01';
    var to = (y + 1) + '-06-30';
    return state.data.transactions.filter(function (t) { return t.date >= from && t.date <= to; });
  }

  function financialYearMonths(year) {
    var months = [];
    var month;
    for (month = 7; month <= 12; month += 1) months.push(year + '-' + String(month).padStart(2, '0'));
    for (month = 1; month <= 6; month += 1) months.push((year + 1) + '-' + String(month).padStart(2, '0'));
    return months;
  }

  function budgetMonthKey() {
    var year = selectedFyStart();
    var available = financialYearMonths(year);
    if (available.indexOf(state.budgetMonth) === -1) {
      var now = new Date();
      var current = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
      state.budgetMonth = available.indexOf(current) !== -1 ? current : available[0];
    }
    return state.budgetMonth;
  }

  function monthText(key) {
    var parts = String(key).split('-');
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
    return date.toLocaleDateString('en-AU', { month: 'long', year: 'numeric' });
  }

  function stat(label, value, note) {
    return '<article class="stat"><span class="meta">' + escapeHtml(label) + '</span><strong>' + escapeHtml(value) + '</strong><div class="mini">' + escapeHtml(note) + '</div></article>';
  }

  function taxChip(t) {
    if (t.taxStatus === 'Not deductible') return '<span class="chip">No</span>';
    if (t.taxStatus === 'Needs review') return '<span class="chip review">Review</span>';
    return '<span class="chip tax">' + Number(t.deductiblePercent || 0) + '%</span>';
  }

  function transactionTable(transactions, clickable) {
    if (!transactions.length) return '<div class="empty"><strong>No transactions found</strong>Import a CSV or change your filters.</div>';
    var rows = transactions.map(function (t) {
      var attrs = clickable ? ' data-tx="' + escapeHtml(t.id) + '" tabindex="0" role="button"' : '';
      return '<tr' + attrs + '><td><span class="merchant">' + escapeHtml(t.merchant || t.description) + (t.receiptFileId ? ' <span title="Receipt attached">📎</span>' : '') + '</span><span class="sub">' + dateText(t.date) + ' · ' + escapeHtml(t.account) + '</span><span class="tag-list">' + tagChips(t) + '</span></td><td><span class="chip ' + (needsReview(t) ? 'review' : '') + '">' + escapeHtml(categoryNameLabel(t.category)) + '</span></td><td>' + escapeHtml(t.owner || 'Joint') + '</td><td>' + taxChip(t) + '</td><td class="amount ' + (t.amount > 0 ? 'income' : '') + '">' + money.format(t.amount) + '</td></tr>';
    }).join('');
    return '<div class="table-wrap"><table><thead><tr><th>Merchant</th><th>Category</th><th>Owner</th><th>Tax</th><th style="text-align:right">Amount</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  function renderDashboard() {
    var tx = fyTransactions();
    var income = sum(tx.filter(function (t) { return t.amount > 0; }).map(function (t) { return t.amount; }));
    var spend = Math.abs(sum(tx.filter(function (t) { return t.amount < 0 && t.category !== 'Transfers'; }).map(function (t) { return t.amount; })));
    var deductions = sum(taxItems(tx).filter(function (t) { return t.amount < 0; }).map(deductibleValue));
    var reviewCount = tx.filter(needsReview).length;
    var recent = state.data.transactions.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); }).slice(0, 8);
    return '<div class="hero-row"><article class="balance-card"><span class="label">Net cash flow · ' + selectedFyLabel() + '</span><div class="big">' + money.format(income - spend) + '</div><div class="delta">' + (income ? Math.round(((income - spend) / income) * 100) : 0) + '% of income retained</div></article><article class="review-card"><div><div class="number">' + reviewCount + '</div><h2>Transactions need review</h2><p>Confirm categories and tax treatment, then remember repeat merchants.</p></div><button class="secondary" data-go="review">Review now</button></article></div>' +
      '<div class="stat-grid">' + stat('Income', money.format(income), 'This financial year') + stat('Spending', money.format(spend), 'Transfers excluded') + stat('Potential deductions', money.format(deductions), 'Before accountant review') + stat('Transactions', tx.length, selectedFyLabel()) + '</div>' +
      '<section class="panel"><div class="panel-head"><div><h2>Recent transactions</h2><p>Your latest imported activity</p></div><button class="secondary" data-go="transactions">View all</button></div>' + transactionTable(recent, false) + '</section>';
  }

  function renderTransactions(onlyReview) {
    var tx = state.data.transactions.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
    if (onlyReview) tx = tx.filter(needsReview);
    if (state.search) {
      var query = state.search.toLowerCase();
      tx = tx.filter(function (t) { return [t.merchant, t.description, t.account, t.category, categoryNameLabel(t.category), t.owner, t.notes, t.tags].join(' ').toLowerCase().indexOf(query) !== -1; });
    }
    if (state.category !== 'all') tx = tx.filter(function (t) { return t.category === state.category; });
    if (state.tag !== 'all') tx = tx.filter(function (t) { return transactionTags(t).indexOf(state.tag) !== -1; });
    var toolbar = '<div class="toolbar"><input id="transactionSearch" type="search" placeholder="Search transactions" value="' + escapeHtml(state.search) + '"><select id="transactionCategory"><option value="all">All categories</option>' + categoryOptions(state.data.categories, state.category) + '</select><select id="transactionTag"><option value="all">All tags</option>' + options((state.data.tags || []).map(function (t) { return t.Name; }), state.tag) + '</select><span class="chip">' + tx.length + ' shown</span></div>';
    return '<section class="panel"><div class="panel-head"><div><h2>' + (onlyReview ? 'Transactions needing review' : 'All transactions') + '</h2><p>Search descriptions, accounts, categories, notes and tags.</p></div></div>' + toolbar + transactionTable(tx, true) + '</section>';
  }

  function renderBudget() {
    var year = selectedFyStart();
    var monthKey = budgetMonthKey();
    var sourceTransactions = fyTransactions();
    if (state.budgetMode === 'Monthly') sourceTransactions = sourceTransactions.filter(function (t) { return String(t.date).indexOf(monthKey) === 0; });
    var spending = {};
    budgetItems(sourceTransactions).filter(function (t) { return Number(t.amount) < 0 && t.category !== 'Transfers'; }).forEach(function (t) { spending[t.category] = (spending[t.category] || 0) + Math.abs(Number(t.amount)); });
    var budgets = (state.data.budgets || []).filter(function (b) {
      var type = String(b.PeriodType || 'Annual');
      return Number(b.FinancialYear) === year && type === state.budgetMode && (type === 'Annual' || String(b.PeriodKey) === monthKey);
    });
    var rows = state.data.categories.filter(function (c) { return ['Income', 'Transfers', 'Split'].indexOf(String(c.Name)) === -1; }).map(function (category) {
      var budget = budgets.filter(function (b) { return String(b.Category) === String(category.Name); })[0];
      var hasBudget = !!budget;
      var planned = Number(budget ? budget.Amount : 0);
      var spent = Number(spending[category.Name] || 0);
      var remaining = planned - spent;
      var percent = planned > 0 ? Math.min(100, spent / planned * 100) : (spent > 0 ? 100 : 0);
      return '<div class="budget-row"><div><strong>' + escapeHtml(categoryLabel(category)) + '</strong><span>' + money.format(spent) + ' spent · ' + (hasBudget ? money.format(planned) + ' budget' : 'No budget') + '</span></div><div class="budget-track"><i class="' + (spent > planned && hasBudget ? 'over' : '') + '" style="width:' + percent + '%"></i></div><strong class="budget-remaining ' + (remaining < 0 && hasBudget ? 'negative' : '') + '">' + (hasBudget ? money.format(remaining) : '—') + '</strong><div class="budget-edit"><span>$</span><input class="budget-input" type="number" min="0" step="0.01" value="' + (hasBudget ? planned : '') + '" placeholder="0"><button class="secondary" data-budget-category="' + escapeHtml(category.Name) + '">Save</button></div></div>';
    }).join('');
    var totalSpent = sum(Object.keys(spending).map(function (key) { return spending[key]; }));
    var totalBudget = sum(budgets.map(function (b) { return b.Amount; }));
    var budgetedSpent = sum(budgets.map(function (b) { return spending[b.Category] || 0; }));
    var periodLabel = state.budgetMode === 'Monthly' ? monthText(monthKey) : selectedFyLabel();
    var monthOptions = financialYearMonths(year).map(function (key) { return '<option value="' + key + '"' + (key === monthKey ? ' selected' : '') + '>' + escapeHtml(monthText(key)) + '</option>'; }).join('');
    var controls = '<div class="toolbar budget-toolbar"><label>View <select id="budgetMode"><option' + (state.budgetMode === 'Annual' ? ' selected' : '') + '>Annual</option><option' + (state.budgetMode === 'Monthly' ? ' selected' : '') + '>Monthly</option></select></label>' + (state.budgetMode === 'Monthly' ? '<label>Month <select id="budgetMonth">' + monthOptions + '</select></label>' : '') + '</div>';
    return controls + '<div class="stat-grid">' + stat('Total budget', money.format(totalBudget), periodLabel) + stat('Total spent', money.format(totalSpent), 'Transfers excluded') + stat('Budget remaining', money.format(totalBudget - budgetedSpent), 'Budgeted categories only') + stat('Categories budgeted', budgets.length, periodLabel) + '</div><section class="panel"><div class="panel-head"><div><h2>Category budgets</h2><p>Annual and monthly budgets are stored separately.</p></div></div><div class="budget-list">' + rows + '</div></section>';
  }

  function renderTax() {
    var tx = taxItems(fyTransactions()).filter(function (t) { return t.amount < 0 && Number(t.deductiblePercent) > 0; });
    var owners = ['You', 'Wife', 'Joint'];
    var total = sum(tx.map(deductibleValue));
    var cards = owners.map(function (owner) {
      var value = sum(tx.filter(function (t) { return t.owner === owner; }).map(deductibleValue));
      return stat(owner, money.format(value), 'Potential deductions');
    }).join('');
    var rows = tx.map(function (t) {
      return '<tr><td><span class="merchant">' + escapeHtml(t.merchant || t.description) + '</span><span class="sub">' + dateText(t.date) + '</span></td><td>' + escapeHtml(categoryNameLabel(t.category)) + '</td><td>' + escapeHtml(t.owner) + '</td><td class="amount">' + money.format(deductibleValue(t)) + '</td></tr>';
    }).join('');
    var groups = {};
    tx.forEach(function (item) {
      var category = state.data.categories.filter(function (candidate) { return String(candidate.Name) === String(item.category); })[0];
      var parent = category && category.Parent ? String(category.Parent) : String(category ? category.Name : item.category || 'Uncategorised');
      var categoryName = String(category ? category.Name : item.category || 'Uncategorised');
      if (!groups[parent]) groups[parent] = { total: 0, count: 0, categories: {} };
      if (!groups[parent].categories[categoryName]) groups[parent].categories[categoryName] = { total: 0, count: 0 };
      var value = deductibleValue(item);
      groups[parent].total += value;
      groups[parent].count += 1;
      groups[parent].categories[categoryName].total += value;
      groups[parent].categories[categoryName].count += 1;
    });
    var summaryRows = Object.keys(groups).sort().map(function (parent) {
      var group = groups[parent];
      var names = Object.keys(group.categories).sort();
      var details = '';
      if (names.length > 1 || names[0] !== parent) {
        details = names.map(function (name) {
          var item = group.categories[name];
          return '<tr class="tax-subcategory"><td></td><td>' + escapeHtml(name === parent ? 'General' : name) + '</td><td>' + item.count + '</td><td class="amount">' + money.format(item.total) + '</td></tr>';
        }).join('');
      }
      return '<tr class="tax-category"><td><strong>' + escapeHtml(parent) + '</strong></td><td>All subcategories</td><td>' + group.count + '</td><td class="amount"><strong>' + money.format(group.total) + '</strong></td></tr>' + details;
    }).join('');
    var summary = '<section class="panel"><div class="panel-head"><div><h2>Tax expenses by category</h2><p>Parent categories include their subcategory totals · ' + selectedFyLabel() + '</p></div></div><div class="table-wrap"><table><thead><tr><th>Category</th><th>Subcategory</th><th>Items</th><th style="text-align:right">Deductible</th></tr></thead><tbody>' + (summaryRows || '<tr><td colspan="4"><div class="empty">No potential deductions recorded</div></td></tr>') + '</tbody></table></div></section>';
    var detail = '<section class="panel"><div class="panel-head"><div><h2>Tax expense detail</h2><p>' + selectedFyLabel() + '</p></div></div><div class="table-wrap"><table><thead><tr><th>Merchant</th><th>Category</th><th>Owner</th><th>Deductible</th></tr></thead><tbody>' + (rows || '<tr><td colspan="4"><div class="empty">No potential deductions recorded</div></td></tr>') + '</tbody></table></div></section>';
    return '<div class="stat-grid">' + cards + stat('Total', money.format(total), 'Before accountant review') + '</div>' + summary + detail;
  }

  function options(values, current) {
    return values.map(function (value) { return '<option' + (String(value) === String(current) ? ' selected' : '') + '>' + escapeHtml(value) + '</option>'; }).join('');
  }

  function categoryLabel(category) {
    return category && category.Parent ? String(category.Parent) + ' › ' + String(category.Name) : String(category ? category.Name : '');
  }

  function categoryNameLabel(name) {
    var category = state.data.categories.filter(function (item) { return String(item.Name) === String(name); })[0];
    return category ? categoryLabel(category) : String(name || 'Uncategorised');
  }

  function categoryOptions(categories, current) {
    return categories.slice().sort(function (a, b) { return categoryLabel(a).localeCompare(categoryLabel(b)); }).map(function (category) {
      return '<option value="' + escapeHtml(category.Name) + '"' + (String(category.Name) === String(current) ? ' selected' : '') + '>' + escapeHtml(categoryLabel(category)) + '</option>';
    }).join('');
  }

  function renderRules() {
    var rows = state.data.rules.map(function (r) {
      return '<div class="rule"><code>' + escapeHtml(r.Pattern) + '</code><span>' + escapeHtml(categoryNameLabel(r.Category)) + '</span><span>' + escapeHtml(r.Owner || 'Joint') + '</span><span class="chip">' + escapeHtml(r.TaxStatus) + '</span><button class="danger" data-delete-rule="' + escapeHtml(r.Id) + '">Delete</button></div>';
    }).join('');
    return '<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Categorisation rules</h2><p>Known merchants are classified automatically.</p></div></div><div class="rules-list">' + rows + '</div></section><section class="panel"><div class="panel-head"><div><h2>Add a rule</h2></div></div><form id="ruleForm" class="form-grid"><div class="field full"><label>Pattern</label><input name="pattern" required></div><div class="field"><label>Category</label><select name="category">' + categoryOptions(state.data.categories) + '</select></div><div class="field"><label>Owner</label><select name="owner">' + options(['Joint', 'You', 'Wife']) + '</select></div><div class="field"><label>Tax treatment</label><select name="taxStatus">' + options(['Not deductible', 'Needs review', 'Potential deduction', 'Deductible']) + '</select></div><div class="field"><label>Deductible %</label><input name="deductiblePercent" type="number" min="0" max="100" value="0"></div><div class="field full"><button class="primary" type="submit">Save rule</button></div></form></section></div>';
  }

  function renderImport() {
    return '<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Import a bank CSV</h2><p>Choose the destination account first.</p></div></div><div class="form-grid"><div class="field"><label>Account</label><select id="importAccount">' + options(state.data.accounts.map(function (a) { return a.Name; })) + '</select></div><div class="field"><label>Default owner</label><select id="importOwner">' + options(['Joint', 'You', 'Wife']) + '</select></div></div><label class="dropzone"><span class="upload-icon">↑</span><strong>Choose a CSV file</strong><p>Date, Description and Amount—or Debit/Credit—columns are supported.</p><input id="csvFile" type="file" accept=".csv,text/csv"><button type="button" class="secondary" id="chooseFile">Choose file</button></label><div id="importResult"></div></section><section class="panel"><div class="panel-head"><div><h2>Portable by design</h2><p>Keep an independent copy whenever you want.</p></div></div><div class="bars"><button class="secondary" id="exportData">Export all data</button></div></section></div>';
  }

  function renderManage() {
    var accountRows = state.data.accounts.map(function (account) {
      return '<div class="manage-row"><div><strong>' + escapeHtml(account.Name) + '</strong><span>' + escapeHtml(account.Provider || 'No provider') + ' · ' + escapeHtml(account.Type) + ' · ' + escapeHtml(account.Owner) + '</span></div><div class="row-actions"><button class="secondary" data-edit-account="' + escapeHtml(account.Id) + '" data-name="' + escapeHtml(account.Name) + '" data-provider="' + escapeHtml(account.Provider || '') + '" data-type="' + escapeHtml(account.Type) + '" data-owner="' + escapeHtml(account.Owner) + '">Edit</button><button class="danger" data-archive-account="' + escapeHtml(account.Id) + '">Archive</button></div></div>';
    }).join('');
    var categoryRows = state.data.categories.map(function (category) {
      var protectedCategory = ['Uncategorised', 'Transfers', 'Split'].indexOf(String(category.Name)) !== -1;
      var action = protectedCategory ? '<span class="chip">System</span>' : '<button class="danger" data-archive-category="' + escapeHtml(category.Name) + '">Archive</button>';
      return '<div class="manage-row ' + (category.Parent ? 'subcategory-row' : '') + '"><div class="category-name"><i style="background:' + escapeHtml(category.Colour || '#4f86f7') + '"></i><div><strong>' + escapeHtml(category.Name) + '</strong><span>' + escapeHtml(category.Group || 'Other') + (category.Parent ? ' · under ' + escapeHtml(category.Parent) : '') + '</span></div></div>' + action + '</div>';
    }).join('');
    var parentCategories = state.data.categories.filter(function (category) { return !category.Parent && ['Income', 'Transfers', 'Split', 'Uncategorised'].indexOf(String(category.Name)) === -1; });
    var parentOptions = '<option value="">No parent category</option>' + categoryOptions(parentCategories);
    var tagRows = (state.data.tags || []).map(function (tag) {
      return '<div class="manage-row"><div class="category-name"><i style="background:' + escapeHtml(tag.Colour || '#18a889') + '"></i><div><strong>' + escapeHtml(tag.Name) + '</strong><span>Transaction tag</span></div></div><button class="danger" data-archive-tag="' + escapeHtml(tag.Name) + '">Archive</button></div>';
    }).join('');
    return '<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Accounts</h2><p>Accounts remain on historical transactions after archiving.</p></div></div><div class="manage-list">' + accountRows + '</div><form id="accountForm" class="form-grid"><input type="hidden" name="id"><div class="field full"><label>Account name</label><input name="name" required></div><div class="field full"><label>Provider or bank</label><input name="provider" placeholder="e.g. ANZ, CommBank, Amex"></div><div class="field"><label>Type</label><select name="type">' + options(['Transaction', 'Savings', 'Credit card', 'Mortgage', 'Other']) + '</select></div><div class="field"><label>Owner</label><select name="owner">' + options(['Joint', 'You', 'Wife']) + '</select></div><div class="field full account-form-actions"><button class="primary" id="accountSubmit" type="submit">Add account</button><button class="secondary hidden" id="cancelAccountEdit" type="button">Cancel edit</button></div></form></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Categories</h2><p>Add top-level categories or place a subcategory beneath one.</p></div></div><div class="manage-list">' + categoryRows + '</div><form id="categoryForm" class="form-grid"><div class="field full"><label>Category name</label><input name="name" required></div><div class="field"><label>Parent category</label><select name="parent">' + parentOptions + '</select></div><div class="field"><label>Group</label><select name="group">' + options(['Household', 'Lifestyle', 'Personal', 'Work', 'Tax', 'Income', 'Other']) + '</select></div><div class="field"><label>Colour</label><input name="colour" type="color" value="#4f86f7"></div><div class="field full"><button class="primary" type="submit">Add category</button></div></form></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Tags</h2><p>Create flexible labels such as Holiday, Reimbursable or Renovation.</p></div></div><div class="manage-list">' + (tagRows || '<div class="empty">No tags yet</div>') + '</div><form id="tagForm" class="form-grid"><div class="field"><label>Tag name</label><input name="name" required></div><div class="field"><label>Colour</label><input name="colour" type="color" value="#18a889"></div><div class="field full"><button class="primary" type="submit">Add tag</button></div></form></section></div>';
  }

  function render() {
    if (!state.data) return;
    document.getElementById('reviewBadge').textContent = state.data.transactions.filter(needsReview).length;
    var html;
    if (state.view === 'dashboard') html = renderDashboard();
    else if (state.view === 'transactions') html = renderTransactions(false);
    else if (state.view === 'review') html = renderTransactions(true);
    else if (state.view === 'tax') html = renderTax();
    else if (state.view === 'budget') html = renderBudget();
    else if (state.view === 'rules') html = renderRules();
    else if (state.view === 'manage') html = renderManage();
    else html = renderImport();
    document.getElementById('content').innerHTML = html;
    bindView();
  }

  function openTransaction(id) {
    var t = state.data.transactions.filter(function (item) { return item.id === id; })[0];
    if (!t) return;
    state.selected = t;
    var categories = state.data.categories;
    var drawer = document.getElementById('drawer');
    var existingSplits = transactionSplits(t.id);
    var selectedTags = transactionTags(t);
    var tagChoices = (state.data.tags || []).map(function (tag) { return '<label class="tag-choice"><input type="checkbox" name="transactionTag" value="' + escapeHtml(tag.Name) + '"' + (selectedTags.indexOf(String(tag.Name)) !== -1 ? ' checked' : '') + '><i style="background:' + escapeHtml(tag.Colour || '#18a889') + '"></i>' + escapeHtml(tag.Name) + '</label>'; }).join('');
    drawer.innerHTML = '<div class="drawer-head"><h2>Review transaction</h2><button class="icon-button" id="closeDrawer">×</button></div><form id="txForm" class="drawer-body"><div class="transaction-hero"><strong>' + escapeHtml(t.merchant || t.description) + '</strong><span class="sub">' + dateText(t.date) + ' · ' + escapeHtml(t.account) + '</span><div class="amount">' + money.format(t.amount) + '</div></div><div id="standardFields"><div class="field"><label>Category</label><select name="category">' + categoryOptions(categories, t.category) + '</select></div><div class="field"><label>Owner</label><select name="owner">' + options(['Joint', 'You', 'Wife'], t.owner) + '</select></div><div class="field"><label>Tax treatment</label><select name="taxStatus">' + options(['Not deductible', 'Needs review', 'Potential deduction', 'Deductible'], t.taxStatus) + '</select></div><div class="field"><label>Deductible %</label><input name="deductiblePercent" type="number" min="0" max="100" value="' + Number(t.deductiblePercent || 0) + '"></div></div><div class="field"><label>Tags</label><div class="tag-choices">' + (tagChoices || '<span class="sub">Add tags from Manage first.</span>') + '</div></div><div class="field"><label>Notes</label><textarea name="notes">' + escapeHtml(t.notes || '') + '</textarea></div><div class="field receipt-field"><label>Receipt image or PDF</label><input id="receiptInput" type="file" accept="image/*,.pdf,application/pdf"><span class="sub">' + (t.receiptName ? 'Attached: ' + escapeHtml(t.receiptName) : 'Optional · maximum 5 MB') + '</span>' + (t.receiptFileId ? '<button type="button" class="secondary" id="openReceipt">Open attached receipt</button>' : '') + '</div><label><input type="checkbox" id="remember"> Remember this merchant for future imports</label><button type="button" class="secondary" id="toggleSplit">' + (existingSplits.length ? 'Edit split' : 'Split transaction') + '</button><div id="splitEditor" class="split-editor hidden"></div><div><button class="primary" type="submit">Save decision</button></div></form>';
    document.getElementById('drawerBackdrop').classList.remove('hidden');
    drawer.classList.add('open');
    document.getElementById('closeDrawer').onclick = closeDrawer;
    document.getElementById('txForm').onsubmit = saveTransaction;
    document.getElementById('toggleSplit').onclick = function () { showSplitEditor(t, existingSplits); };
    if (t.receiptFileId) document.getElementById('openReceipt').onclick = function () { openReceipt(t.receiptFileId); };
    if (existingSplits.length) showSplitEditor(t, existingSplits);
  }

  function splitRow(part) {
    var categories = state.data.categories.filter(function (c) { return c.Name !== 'Split'; });
    return '<div class="split-row"><input class="split-amount" type="number" min="0.01" step="0.01" value="' + escapeHtml(part.Amount || '') + '" placeholder="Amount"><select class="split-category">' + categoryOptions(categories, part.Category) + '</select><select class="split-owner">' + options(['Joint', 'You', 'Wife'], part.Owner || 'Joint') + '</select><select class="split-tax">' + options(['Not deductible', 'Needs review', 'Potential deduction', 'Deductible'], part.TaxStatus || 'Not deductible') + '</select><input class="split-percent" type="number" min="0" max="100" value="' + Number(part.DeductiblePercent || 0) + '" title="Deductible percentage"><button type="button" class="danger split-remove">×</button></div>';
  }

  function showSplitEditor(transaction, parts) {
    var editor = document.getElementById('splitEditor');
    var amount = Math.abs(Number(transaction.amount));
    var initial = parts.length ? parts : [{ Amount: (amount / 2).toFixed(2), Owner: transaction.owner }, { Amount: (amount - amount / 2).toFixed(2), Owner: transaction.owner }];
    editor.classList.remove('hidden');
    editor.innerHTML = '<div class="split-head"><strong>Split allocation</strong><span>Total must equal ' + money.format(amount) + '</span></div><div id="splitRows">' + initial.map(splitRow).join('') + '</div><div class="split-actions"><button type="button" class="secondary" id="addSplitRow">Add part</button><strong id="splitTotal"></strong></div>';
    bindSplitRows();
    document.getElementById('addSplitRow').onclick = function () { document.getElementById('splitRows').insertAdjacentHTML('beforeend', splitRow({ Owner: transaction.owner })); bindSplitRows(); };
  }

  function bindSplitRows() {
    var removes = document.querySelectorAll('.split-remove');
    var amounts = document.querySelectorAll('.split-amount');
    var i;
    for (i = 0; i < removes.length; i += 1) removes[i].onclick = function () { this.parentNode.remove(); updateSplitTotal(); };
    for (i = 0; i < amounts.length; i += 1) amounts[i].oninput = updateSplitTotal;
    updateSplitTotal();
  }

  function updateSplitTotal() {
    var amounts = document.querySelectorAll('.split-amount');
    var total = 0;
    var i;
    for (i = 0; i < amounts.length; i += 1) total += Number(amounts[i].value || 0);
    var el = document.getElementById('splitTotal');
    if (el) el.textContent = 'Allocated: ' + money.format(total);
  }

  function collectSplits() {
    var rows = document.querySelectorAll('.split-row');
    var output = [];
    var i;
    for (i = 0; i < rows.length; i += 1) {
      output.push({ amount: Number(rows[i].querySelector('.split-amount').value || 0), category: rows[i].querySelector('.split-category').value, owner: rows[i].querySelector('.split-owner').value, taxStatus: rows[i].querySelector('.split-tax').value, deductiblePercent: Number(rows[i].querySelector('.split-percent').value || 0) });
    }
    return output;
  }

  function closeDrawer() {
    document.getElementById('drawer').classList.remove('open');
    document.getElementById('drawerBackdrop').classList.add('hidden');
  }

  function openReceipt(fileId) {
    var popup = window.open('about:blank', '_blank');
    server('getReceiptUrl', [fileId], function (url) {
      if (popup) popup.location = url;
      else window.location.href = url;
    }, function (error) {
      if (popup) popup.close();
      showError(error);
    });
  }

  function completeTransactionSave(message) {
    var input = document.getElementById('receiptInput');
    var file = input && input.files ? input.files[0] : null;
    function finish() { closeDrawer(); loadData(); toast(message); }
    if (!file) { finish(); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var encoded = String(reader.result).split(',')[1];
      server('uploadReceipt', [{ transactionId: state.selected.id, filename: file.name, mimeType: file.type || 'application/octet-stream', base64: encoded }], function () { finish(); });
    };
    reader.onerror = function () { toast('The receipt could not be read.'); };
    reader.readAsDataURL(file);
  }

  function saveTransaction(event) {
    event.preventDefault();
    var form = event.target;
    var receipt = document.getElementById('receiptInput');
    var receiptFile = receipt && receipt.files ? receipt.files[0] : null;
    if (receiptFile && receiptFile.size > 5 * 1024 * 1024) { toast('Receipt must be under 5 MB.'); return; }
    var checkedTags = form.querySelectorAll('input[name="transactionTag"]:checked');
    var tags = [];
    var tagIndex;
    for (tagIndex = 0; tagIndex < checkedTags.length; tagIndex += 1) tags.push(checkedTags[tagIndex].value);
    var patch = { id: state.selected.id, category: form.category.value, owner: form.owner.value, taxStatus: form.taxStatus.value, deductiblePercent: Number(form.deductiblePercent.value || 0), notes: form.notes.value, tags: tags, reviewed: true };
    var splitEditor = document.getElementById('splitEditor');
    var splits = splitEditor && !splitEditor.classList.contains('hidden') ? collectSplits() : null;
    server('updateTransaction', [patch], function (result) {
      var matched = result && Number(result.merchantMatches || 0);
      var matchNote = matched ? ' · ' + matched + ' matching transaction' + (matched === 1 ? '' : 's') + ' updated' : '';
      if (splits) {
        server('saveTransactionSplits', [{ transactionId: state.selected.id, splits: splits }], function () { completeTransactionSave('Split transaction saved' + matchNote); });
        return;
      }
      if (document.getElementById('remember').checked) {
        server('saveRule', [{ pattern: state.selected.merchant || state.selected.description, matchType: 'contains', account: state.selected.account, category: patch.category, owner: patch.owner, taxStatus: patch.taxStatus, deductiblePercent: patch.deductiblePercent, tags: patch.tags, priority: 70 }], function () { completeTransactionSave('Transaction and rule saved' + matchNote); });
      } else { completeTransactionSave('Transaction saved' + matchNote); }
    });
  }

  function formObject(form) {
    var out = {};
    var fields = form.elements;
    var i;
    for (i = 0; i < fields.length; i += 1) if (fields[i].name) out[fields[i].name] = fields[i].value;
    return out;
  }

  function runImport(file) {
    if (!file || !/\.csv$/i.test(file.name)) { toast('Choose a CSV file.'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      server('importCsv', [{ csvText: reader.result, filename: file.name, account: document.getElementById('importAccount').value, owner: document.getElementById('importOwner').value }], function (result) {
        document.getElementById('importResult').innerHTML = '<div class="import-result">Imported ' + result.imported + ' transactions · skipped ' + result.duplicates + ' duplicates · raw CSV saved</div>';
        loadData(); toast('Import complete');
      });
    };
    reader.readAsText(file);
  }

  function exportData() {
    server('exportAllData', [], function (all) {
      var text = JSON.stringify(all, null, 2);
      var link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      link.download = 'home-ledger-au-export.json';
      link.click();
      URL.revokeObjectURL(link.href);
    });
  }

  function bindView() {
    var i;
    var go = document.querySelectorAll('[data-go]');
    for (i = 0; i < go.length; i += 1) go[i].onclick = function () { setView(this.getAttribute('data-go')); };
    var tx = document.querySelectorAll('[data-tx]');
    for (i = 0; i < tx.length; i += 1) tx[i].onclick = function () { openTransaction(this.getAttribute('data-tx')); };
    var transactionSearch = document.getElementById('transactionSearch');
    if (transactionSearch) transactionSearch.oninput = function () {
      state.search = this.value;
      render();
      var replacement = document.getElementById('transactionSearch');
      if (replacement) { replacement.focus(); replacement.setSelectionRange(replacement.value.length, replacement.value.length); }
    };
    var transactionCategory = document.getElementById('transactionCategory');
    if (transactionCategory) transactionCategory.onchange = function () { state.category = this.value; render(); };
    var transactionTag = document.getElementById('transactionTag');
    if (transactionTag) transactionTag.onchange = function () { state.tag = this.value; render(); };
    var ruleForm = document.getElementById('ruleForm');
    if (ruleForm) ruleForm.onsubmit = function (event) { event.preventDefault(); server('saveRule', [formObject(ruleForm)], function () { loadData(); toast('Rule saved'); }); };
    var deleteButtons = document.querySelectorAll('[data-delete-rule]');
    for (i = 0; i < deleteButtons.length; i += 1) deleteButtons[i].onclick = function () { var id = this.getAttribute('data-delete-rule'); server('deleteRule', [id], function () { loadData(); }); };
    var choose = document.getElementById('chooseFile');
    if (choose) choose.onclick = function () { document.getElementById('csvFile').click(); };
    var file = document.getElementById('csvFile');
    if (file) file.onchange = function () { runImport(file.files[0]); };
    var exportButton = document.getElementById('exportData');
    if (exportButton) exportButton.onclick = exportData;
    var accountForm = document.getElementById('accountForm');
    if (accountForm) accountForm.onsubmit = function (event) {
      event.preventDefault();
      var payload = formObject(accountForm);
      var method = payload.id ? 'updateAccount' : 'saveAccount';
      var message = payload.id ? 'Account updated' : 'Account added';
      server(method, [payload], function () { loadData(); setView('manage'); toast(message); });
    };
    var categoryForm = document.getElementById('categoryForm');
    if (categoryForm) categoryForm.onsubmit = function (event) { event.preventDefault(); server('saveCategory', [formObject(categoryForm)], function () { loadData(); setView('manage'); toast('Category added'); }); };
    var tagForm = document.getElementById('tagForm');
    if (tagForm) tagForm.onsubmit = function (event) { event.preventDefault(); server('saveTag', [formObject(tagForm)], function () { loadData(); setView('manage'); toast('Tag added'); }); };
    var accountButtons = document.querySelectorAll('[data-archive-account]');
    for (i = 0; i < accountButtons.length; i += 1) accountButtons[i].onclick = function () { var id = this.getAttribute('data-archive-account'); server('archiveAccount', [id], function () { loadData(); setView('manage'); }); };
    var editAccountButtons = document.querySelectorAll('[data-edit-account]');
    for (i = 0; i < editAccountButtons.length; i += 1) editAccountButtons[i].onclick = function () {
      accountForm.elements.id.value = this.getAttribute('data-edit-account');
      accountForm.elements.name.value = this.getAttribute('data-name');
      accountForm.elements.provider.value = this.getAttribute('data-provider');
      accountForm.elements.type.value = this.getAttribute('data-type');
      accountForm.elements.owner.value = this.getAttribute('data-owner');
      document.getElementById('accountSubmit').textContent = 'Save account';
      document.getElementById('cancelAccountEdit').classList.remove('hidden');
      accountForm.elements.name.focus();
    };
    var cancelAccountEdit = document.getElementById('cancelAccountEdit');
    if (cancelAccountEdit) cancelAccountEdit.onclick = function () { accountForm.reset(); accountForm.elements.id.value = ''; document.getElementById('accountSubmit').textContent = 'Add account'; this.classList.add('hidden'); };
    var categoryButtons = document.querySelectorAll('[data-archive-category]');
    for (i = 0; i < categoryButtons.length; i += 1) categoryButtons[i].onclick = function () { var name = this.getAttribute('data-archive-category'); server('archiveCategory', [name], function () { loadData(); setView('manage'); }); };
    var tagButtons = document.querySelectorAll('[data-archive-tag]');
    for (i = 0; i < tagButtons.length; i += 1) tagButtons[i].onclick = function () { var name = this.getAttribute('data-archive-tag'); server('archiveTag', [name], function () { loadData(); setView('manage'); }); };
    var budgetButtons = document.querySelectorAll('[data-budget-category]');
    for (i = 0; i < budgetButtons.length; i += 1) budgetButtons[i].onclick = function () {
      var category = this.getAttribute('data-budget-category');
      var amount = this.parentNode.querySelector('.budget-input').value;
      if (amount === '' || isNaN(Number(amount)) || Number(amount) < 0) { toast('Enter a valid budget amount.'); return; }
      server('saveBudget', [{ category: category, financialYear: selectedFyStart(), amount: Number(amount), periodType: state.budgetMode, periodKey: state.budgetMode === 'Monthly' ? budgetMonthKey() : '' }], function () { loadData(); setView('budget'); toast(state.budgetMode === 'Monthly' ? 'Monthly budget saved' : 'Annual budget saved'); });
    };
    var budgetMode = document.getElementById('budgetMode');
    if (budgetMode) budgetMode.onchange = function () { state.budgetMode = this.value; render(); };
    var budgetMonth = document.getElementById('budgetMonth');
    if (budgetMonth) budgetMonth.onchange = function () { state.budgetMonth = this.value; render(); };
  }

  function buildFySelect() {
    var select = document.getElementById('fySelect');
    if (select.options.length) return;
    var now = new Date();
    var start = now.getMonth() >= 6 ? now.getFullYear() : now.getFullYear() - 1;
    var i;
    for (i = 0; i < 5; i += 1) {
      var y = start - i;
      var option = document.createElement('option');
      option.value = y;
      option.textContent = 'FY ' + y + '–' + String(y + 1).slice(-2);
      select.appendChild(option);
    }
    select.onchange = render;
  }

  function init() {
    document.getElementById('nav').onclick = function (event) {
      var button = event.target.closest('[data-view]');
      if (button) setView(button.getAttribute('data-view'));
    };
    var jump = document.querySelectorAll('[data-view-jump]');
    var i;
    for (i = 0; i < jump.length; i += 1) jump[i].onclick = function () { setView(this.getAttribute('data-view-jump')); };
    document.getElementById('menuButton').onclick = function () { document.querySelector('.sidebar').classList.add('open'); };
    document.getElementById('drawerBackdrop').onclick = closeDrawer;
    loadData();
  }

  try { init(); } catch (error) { showError(error); }
}());
</script>
