<script>

  function renderManage() {
    var accountRows = state.data.accounts.map(function (account) {
      return '<div class="manage-row"><div><strong>' + escapeHtml(account.Name) + '</strong><span>' + escapeHtml(account.Provider || 'No provider') + ' · ' + escapeHtml(account.Type) + ' · ' + escapeHtml(account.Owner) + '</span></div><div class="row-actions"><button class="secondary" data-edit-account="' + escapeHtml(account.Id) + '" data-name="' + escapeHtml(account.Name) + '" data-provider="' + escapeHtml(account.Provider || '') + '" data-type="' + escapeHtml(account.Type) + '" data-owner="' + escapeHtml(account.Owner) + '">Edit</button><button class="danger" data-archive-account="' + escapeHtml(account.Id) + '">Archive</button></div></div>';
    }).join('');
    var categoryRows = state.data.categories.map(function (category) {
      var protectedCategory = ['Uncategorised', 'Transfers', 'Split'].indexOf(String(category.Name)) !== -1;
      var action = protectedCategory ? '<span class="chip">System</span>' : '<button class="danger" data-archive-category="' + escapeHtml(category.Name) + '">Archive</button>';
      return '<div class="manage-row ' + (category.Parent ? 'subcategory-row' : '') + '"><div class="category-name"><i style="background:' + escapeHtml(category.Colour || '#4f86f7') + '"></i><div><strong>' + escapeHtml(category.Name) + '</strong><span>' + escapeHtml(category.Group || 'Other') + (category.Parent ? ' · under ' + escapeHtml(category.Parent) : '') + '</span></div></div>' + action + '</div>';
    }).join('');
    var parentCategories = state.data.categories.filter(function (category) { return !category.Parent && ['Income', 'Transfers', 'Split', 'Uncategorised'].indexOf(String(category.Name)) === -1; });
    var parentOptions = '<option value="">No parent category</option>' + categoryOptions(parentCategories);
    var tagRows = (state.data.tags || []).map(function (tag) {
      return '<div class="manage-row"><div class="category-name"><i style="background:' + escapeHtml(tag.Colour || '#18a889') + '"></i><div><strong>' + escapeHtml(tag.Name) + '</strong><span>Transaction tag</span></div></div><button class="danger" data-archive-tag="' + escapeHtml(tag.Name) + '">Archive</button></div>';
    }).join('');
    return '<div class="two-col"><section class="panel"><div class="panel-head"><div><h2>Accounts</h2><p>Accounts remain on historical transactions after archiving.</p></div></div><div class="manage-list">' + accountRows + '</div><form id="accountForm" class="form-grid"><input type="hidden" name="id"><div class="field full"><label>Account name</label><input name="name" required></div><div class="field full"><label>Provider or bank</label><input name="provider" placeholder="e.g. ANZ, CommBank, Amex"></div><div class="field"><label>Type</label><select name="type">' + options(['Transaction', 'Savings', 'Credit card', 'Mortgage', 'Other']) + '</select></div><div class="field"><label>Owner</label><select name="owner">' + options(['Joint', 'You', 'Wife']) + '</select></div><div class="field full account-form-actions"><button class="primary" id="accountSubmit" type="submit">Add account</button><button class="secondary hidden" id="cancelAccountEdit" type="button">Cancel edit</button></div></form></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Categories</h2><p>Add top-level categories or place a subcategory beneath one.</p></div></div><div class="manage-list">' + categoryRows + '</div><form id="categoryForm" class="form-grid"><div class="field full"><label>Category name</label><input name="name" required></div><div class="field"><label>Parent category</label><select name="parent">' + parentOptions + '</select></div><div class="field"><label>Group</label><select name="group">' + options(['Incoming funds', 'Home & household', 'Lifestyle & personal', 'Transport', 'Health care', 'Family & education', 'Holidays', 'Financial costs', 'Financial movements', 'Other']) + '</select></div><div class="field"><label>Colour</label><input name="colour" type="color" value="#4f86f7"></div><div class="field full"><button class="primary" type="submit">Add category</button></div></form></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Tags</h2><p>Create flexible labels such as Holiday, Reimbursable or Renovation.</p></div></div><div class="manage-list">' + (tagRows || '<div class="empty">No tags yet</div>') + '</div><form id="tagForm" class="form-grid"><div class="field"><label>Tag name</label><input name="name" required></div><div class="field"><label>Colour</label><input name="colour" type="color" value="#18a889"></div><div class="field full"><button class="primary" type="submit">Add tag</button></div></form></section></div>';
  }

</script>
